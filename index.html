.brand-side{width:min(450px,36vw);display:grid;gap:18px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:#777F73}.brand-side h1{margin:4px 0 0;font-size:clamp(65px,8vw,106px);letter-spacing:-8px;color:var(--forest);font-weight:800;line-height:1.1}.brand-side h2{font-size:clamp(22px,2.6vw,37px);color:var(--forest);font-weight:600;line-height:1.5;letter-spacing:1px;margin:8px 0 0}.brand-side p{font-size:15px;line-height:2;color:#6d736b;max-width:400px}.brand-side small{color:#777F73;line-height:1.7}.brand-side .tag{display:inline-block;border:1px solid #bcc3b6;border-radius:99px;padding:8px 15px;color:var(--forest);font-size:12px;letter-spacing:.4px}.brand-side .line{height:1px;width:80px;background:var(--forest);opacity:.4;margin:15px 0}.mini-flow{display:flex;flex-wrap:wrap;gap:7px}.mini-flow span{border:1px solid #c6c9c0;padding:7px 10px;border-radius:6px;font-size:12px;color:#5e6a5c}

dth:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}.cardimg{background:#d7c7b7;object-fit:cover;display:block;width:100%;border-radius:14px}.cardimg.wide{border-radius:16px}.card-button{text-align:left;padding:0;display:block;width:100%}.card-button img{transition:transform .25s ease}.card-button:active img{transform:scale(.98)}.card-copy{padding:7px 1px 0}.small-name{font-weight:700;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.small-price{font-weight:800;color:var(--forest);font-size:18px;margin-top:7px}.hero-card{height:180px;position:relative;overflow:hidden;border-radius:15px;padding:0;width:100%;text-align:left}.hero-card img{height:100%;object-fit:cover;width:100%;display:block}.hero-tag{position:absolute;top:16px;left:16px;background:#FDFCF8;padding:8px 13px;border-radius:100px;font-size:10px;font-weight:800;letter-spacing:.6px}.hero-cta{position:absolute;bottom:17px;left:17px;right:17px;display:flex;align-items:center;justify-content:space-between;color:white;text-shadow:0 1px 3px #0009;font-size:13px;font-weight:700}

font-size:13px;box-shadow:0 3px 6px #0003}.map-pin:active{transform:scale(.94)}.search-result{display:flex;text-align:left;gap:15px;align-items:center;width:100%;padding:0}.search-result img{width:107px;height:101px;flex-shrink:0;object-fit:cover;border-radius:13px}.search-result .detail{min-width:0;flex:1}.search-result .detail .name{font-size:15px;font-weight:800;color:var(--forest);line-height:1.6}.search-result .detail .sub{font-size:11px;color:var(--muted);margin:6px 0 10px}.search-result .detail .amt{font-size:19px;font-weight:800;color:var(--forest)}.result-list{display:grid;gap:18px;padding-bottom:16px}.head-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.subtle-link{font-size:12px;color:var(--muted)}

{id:1,name:'日隅・季節甜點選物',shop:'日隅甜點工作室',category:'麵包甜點',short:'季節水果與甜點驚喜',price:150,original:320,remaining:2,time:'18:30 – 19:30',distance:'900m',image:images[2],address:'台中西區（示意）',desc:'可能包含季節水果塔、蛋糕或常溫糕點。實際內容與保存方式由店家提供。',allergen:'含有或可能含有麩質、蛋、奶與堅果，實際應向店家確認。'},
{id:2,name:'日暮・肉桂捲組合',shop:'日暮烘焙所',category:'麵包甜點',short:'香濃肉桂・每日少量出爐',price:110,original:240,remaining:4,time:'19:00 – 20:00',distance:'1.2km',image:images[3],address:'台中西區（示意）',desc:'可能包含肉桂捲與其它同日烘焙品項，依實際上架資訊為準。',allergen:'含有或可能含有麩質、蛋、奶與堅果，實際應向店家確認。'}
];
const state={screen:'home',from:'home',selected:0,qty:1,favorites:new Set([0,1]),orders:[],query:'',category:'全部',toast:''};
const $=id=>document.getElementById(id);
const fmt=n=>'NT$'+n;
function toast(s){const t=$('toast');t.className='toast';t.textContent=s;clearTimeout(toast.timer);toast.timer=setTimeout(()=>{t.textContent='';t.className=''},2150)}
function go(s){state.screen=s;$('screen-content').scrollTop=0;render()}
function enterDetail(id){state.from=['detail','checkout','success'].includes(state.screen)?'home':state.screen;state.selected=Number(id);state.qty=1;go('detail')}
function back(){if(state.screen==='checkout')go('detail');else if(state.screen==='detail')go(state.from||'home');else if(state.screen==='success')go('home');else go('home')}
function nav(){const views=[['home','首頁'],['search','探索'],['heart','收藏'],['user','我的']];if(!['home','explore','favorites','account'].includes(state.screen)){$('bottom-nav').style.display='none';return}const active={home:'home',explore:'search',favorites:'heart',account:'user'}[state.screen];$('bottom-nav').style.display='flex';$('bottom-nav').innerHTML=views.map(([id,name])=>`<button class="tab ${active===id?'active':''}" data-action="nav" data-target="${id}" aria-label="${name}" aria-current="${active===id?'page':'false'}">${ic(id)}<span>${name}</span></button>`).join('')}
function card(p){return `<button class="card-button" data-action="open" data-id="${p.id}" aria-label="查看 ${p.name}"><img class="cardimg" src="${p.image}" alt="${p.name} 概念商品示意"/><div class="card-copy"><div class="small-name">${p.name}</div><div class="small-price">${fmt(p.price)}</div><div class="caption">自取 ${p.time}</div></div></button>`}
function home(){return `<section class="page-pad"><header class="brand-head"><div class="brand-logo">餘好<span class="dot">。</span>${ic('leaf')}</div><div class="location">${ic('pin')} 台中 · 草悟道</div></header><div style="margin-top:40px" class="brow">YOUR DAILY GOOD FINDS</div><h1 class="h1" style="margin:17px 0 11px">好食物，<br>值得再相遇。</h1><p class="caption" style="margin:0 0 25px">今天也有一些美好，正等著被帶回家。</p><button class="hero-card" data-action="open" data-id="0" aria-label="查看今日精選職人烘焙袋"><img src="${images[1]}" alt="酸種麵包和金黃可頌"/><span class="hero-tag">TODAY'S PICK</span><span class="hero-cta">手作烘焙的今日驚喜 ${ic('arrow')}</span></button><div class="flex between" style="margin:20px 0 15px"><div class="section-title" style="margin:0">今日精選 / 每一口都是剛好</div><button aria-label="探索所有商品" data-action="nav" data-target="search">${ic('arrow')}</button></div><div class="feature-grid">${card(products[0])}${card(products[1])}</div><div style="margin-top:24px;display:flex;align-items:center;gap:10px;background:var(--ivory);padding:16px;border-radius:14px"><span style="color:var(--forest)">${ic('leaf')}</span><span class="caption">減少浪費，從一份剛好的美味開始。</span></div><p class="footnote">* 所有商品與價格為概念示意，非真實販售。</p></section>`}
function exploreRows(){const q=state.query.trim().toLowerCase();let ps=products.filter(p=>(state.category==='全部'||p.category===state.category)&&(`${p.name}${p.shop}${p.short}`.toLowerCase().includes(q)));return ps.length?ps.map(p=>`<div><button class="search-result" data-action="open" data-id="${p.id}"><img src="${p.image}" alt="${p.name} 示意商品照片"/><div class="detail"><div class="name">${p.shop}</div><div class="sub">${p.short} · 剩 ${p.remaining} 份</div><div class="flex between"><b class="amt">${fmt(p.price)}</b><span class="caption">${p.distance}</span></div></div></button></div>`).join('<div class="line"></div>'):`<div class="empty">沒有符合條件的示意商品。<button data-action="clear-search" class="btn-text">清除搜尋條件</button></div>`}
function explore(){return `<section class="page-pad"><div class="flex between" style="padding-top:9px"><h1 class="h1" style="margin:0;font-size:29px">探索附近</h1><button data-action="loc" aria-label="設定所在區域">${ic('pin')}</button></div><div class="gap22"></div><label class="searchbar">${ic('search')}<input id="find-product" placeholder="尋找附近的好食物或店家" aria-label="搜尋惜食商品" value="${state.query.replace(/"/g,'&quot;')}" autocomplete="off" /></label><div class="gap16"></div><div class="chips">${['全部','麵包甜點','熟食便當','咖啡飲品'].map(c=>`<button class="chip ${state.category===c?'selected':''}" data-action="filter" data-category="${c}">${c}</button>`).join('')}</div><div class="map" aria-label="台中草悟道示意地圖，非實際地圖"><div class="street road-v1"></div><div class="street road-v2"></div><div class="street road-h1"></div><div class="street road-h2"></div><div class="park">草悟道</div><button data-action="open" data-id="0" class="map-pin" style="top:22%;left:16%">1</button><button data-action="open" data-id="1" class="map-pin" style="top:49%;left:61%">2</button><button data-action="open" data-id="2" class="map-pin" style="top:74%;left:44%">3</button></div><div class="gap28"></div><div class="head-row"><div class="section-title" style="margin:0">離你不遠的好味道</div><span class="caption">距離示意</span></div><div class="result-list" id="results">${exploreRows()}</div><p class="footnote">* 地圖及距離純屬概念示意，不提供實際導航。</p></section>`}
function detail(){const p=products[state.selected];return `<div class="detail-screen"><div class="detail-hero"><img class="detail-img" src="${p.image}" alt="${p.name} 示意商品照片"/><div class="detail-actions"><button class="round-icon" data-action="back" aria-label="返回">${ic('back')}</button><button class="round-icon" data-action="fav" data-id="${p.id}" aria-label="${state.favorites.has(p.id)?'取消收藏':'收藏商品'}" style="color:${state.favorites.has(p.id)?'#AC7258':'var(--forest)'}">${ic('heart')}</button></div></div><div class="detail-sheet"><div class="brow">LOCAL SELECTION / BAKERY</div><h2>${p.name}</h2><div class="caption">${p.short}</div><div class="flex between" style="margin:24px 0 19px"><div class="price" style="font-size:28px">${fmt(p.price)}</div><span class="caption">參考原價 ${fmt(p.original)}</span></div><div class="line"></div><div class="gap22"></div><div class="info-row" style="margin-bottom:11px;font-size:16px;font-weight:800">${ic('bag')} 今天可能遇見</div><p class="caption" style="font-size:13px;margin:0 0 22px;line-height:1.9">${p.desc}</p><div class="info-row">${ic('clock')} <b>今日自取 ${p.time}</b></div><div class="info-row">${ic('pin')} <span>${p.shop} · ${p.address}</span></div><div class="line"></div><div class="gap16"></div><div class="caption">${ic('info')} <span style="vertical-align:middle">${p.allergen}</span></div><p class="footnote">本頁店名、原價、食品資訊與供應量均為示意；正式服務需由店家提供與驗證。</p></div></div><div class="sticky-actions"><button class="dark-cta" data-action="checkout">預訂這份好食物 &nbsp; →</button></div>`}
function checkout(){const p=products[state.selected];const total=p.price*state.qty;return `<div class="page-pad" style="padding-bottom:200px"><div class="backrow"><button data-action="back" aria-label="返回商品詳情">${ic('back')}</button><h2>確認預訂</h2></div><div class="brow">ONE MORE GOOD THING</div><div style="font-weight:800;font-size:19px;margin:16px 0 28px">把今天的美好帶回家。</div><div class="order-card"><img src="${p.image}" alt="${p.name} 示意圖片"/><div><div class="title">${p.name}</div><div class="caption">今日限量 · 單份 ${fmt(p.price)}</div><div class="price" style="margin-top:15px">${fmt(total)}</div></div></div><div class="qtyrow"><span>預訂份數</span><div class="counter"><button data-action="minus" aria-label="減少數量">−</button><b>${state.qty}</b><button data-action="plus" aria-label="增加數量">＋</button></div></div><div style="font-weight:800;font-size:17px;color:var(--forest);margin:32px 0 10px">取餐資訊</div><div class="timeline"><div class="timelinerow"><span class="timebullet"></span><div><div class="caption">自取時間</div><div style="font-size:15px;font-weight:700;margin-top:4px">今天 ${p.time}</div></div></div><div class="timelinerow"><span class="timebullet"></span><div><div class="caption">取餐地點</div><div style="font-size:15px;font-weight:700;margin-top:4px">${p.shop} · ${p.address}</div></div></div></div><div class="notice"><div class="flex" style="gap:9px">${ic('info')}<strong>友善提醒</strong></div><p>請於取餐時間內領取，並留意食物保存方式與過敏原資訊。這裡不會進行真正的付款。</p></div><div style="font-weight:800;font-size:16px;margin:24px 0 12px">費用明細</div><div class="summary-line"><span>商品金額 × ${state.qty}</span><span>${fmt(total)}</span></div><div class="line"></div><div class="summary-line total"><span>合計</span><span>${fmt(total)}</span></div></div><div class="sticky-actions"><button class="dark-cta" data-action="confirm">模擬確認預訂 · ${fmt(total)}</button></div>`}
function success(){const o=state.orders[0];const p=products[o?.id??state.selected];return `<div class="success-page"><div class="success-mark">${ic('check')}</div><div class="brow">A SMALL GOOD THING</div><h2>美好的一餐，<br>已為你保留。</h2><p>這是一筆<strong>模擬預訂</strong>，不會真的成立。<br>接下來可以看看訂單，或繼續探索好食物。</p><div class="confirmation"><div class="flex between"><b style="font-size:15px">${p.name}</b><span class="caption">× ${o?.qty||1}</span></div><div class="line" style="margin:15px 0"></div><div class="flex between"><span class="caption">模擬取餐時間</span><b style="font-size:13px">${p.time}</b></div><div class="flex between" style="margin-top:12px"><span class="caption">模擬金額</span><b style="font-size:17px;color:var(--forest)">${fmt((o?.qty||1)*p.price)}</b></div></div><button class="dark-cta" data-action="nav" data-target="user">查看我的模擬訂單 →</button><button class="light-cta" style="width:100%" data-action="nav" data-target="home">繼續探索</button><div class="footnote">DEMO ONLY · 無實際交易 / 無扣款</div></div>`}
function favorites(){const liked=products.filter(p=>state.favorites.has(p.id));return `<section class="page-pad"><div class="h1" style="font-size:29px;margin:9px 0 8px">我的收藏</div><div class="caption">你喜歡的味道，值得再回來看看。</div><div class="gap28"></div><div class="head-row"><div class="section-title" style="margin:0">已收藏 ${liked.length} 個好選擇</div><span class="caption">SHOW SOME LOVE</span></div>${liked.length?`<div class="two-grid">${liked.map(p=>`<div class="favorite-card"><button class="card-button" data-action="open" data-id="${p.id}"><img src="${p.image}" alt="${p.name} 示意商品"/><div class="small-name" style="margin-top:12px">${p.shop}</div><div class="caption">${p.short}</div><div class="small-price">${fmt(p.price)}</div></button><button class="heart-tag" data-action="fav" data-id="${p.id}" aria-label="取消收藏 ${p.name}">${ic('heart')}</button></div>`).join('')}</div>`:`<div class="empty">還沒有收藏的店家。<button class="light-cta" data-action="nav" data-target="search">探索附近的美味</button></div>`}<div style="margin-top:29px;background:var(--ivory);padding:18px;border-radius:15px"><div style="font-size:16px;color:var(--forest);font-weight:800;margin-bottom:6px">讓喜歡，成為日常。</div><div class="caption">收藏店家之後，你就能更快找到曾經心動的選物。</div></div></section>`}
function account(){const n=state.favorites.size;return `<section class="page-pad"><div class="flex between" style="margin:9px 0 26px"><h1 class="h1" style="font-size:29px;margin:0">我的餘好</h1><div style="width:45px;height:45px;display:grid;place-items:center;border-radius:50%;background:var(--beige);color:var(--forest)">${ic('leaf')}</div></div><div class="brow">GOOD CHOICES, EVERY DAY</div><h2 style="font-size:22px;margin:17px 0 24px;color:var(--forest)">你收藏的，都是好日常。</h2><div class="account-banner"><div class="upper">YOUR SMALL, MEANINGFUL STEPS</div><div class="flex" style="gap:25px;margin:11px 0"><span class="num">${String(n).padStart(2,'0')}</span><span style="font-size:13px">已收藏的好店家</span></div><div class="hint">每個選擇，都讓珍惜成為日常。</div></div><div class="gap28"></div><div class="head-row"><div class="section-title" style="margin:0">收藏店家</div><button data-action="nav" data-target="heart" class="subtle-link">查看全部 →</button></div><div class="two-grid">${products.filter(p=>state.favorites.has(p.id)).slice(0,2).map(p=>`<button class="card-button" data-action="open" data-id="${p.id}"><img src="${p.image}" style="height:138px;width:100%;border-radius:13px;object-fit:cover" alt="${p.name} 示意圖片"/><div class="small-name" style="margin-top:11px">${p.shop}</div><div class="caption">${p.short}</div></button>`).join('')||`<div class="caption">目前沒有收藏內容。</div>`}</div><div class="gap28"></div><div class="head-row"><div class="section-title" style="margin:0">我的模擬訂單</div><span class="caption">${state.orders.length} 筆</span></div>${state.orders.length?state.orders.map(o=>{const p=products[o.id];return `<button data-action="open" data-id="${p.id}" class="search-result" style="background:var(--ivory);padding:12px;border-radius:14px"><img src="${p.image}" style="width:70px;height:70px" alt="${p.name}"/><div class="detail"><div class="name">${p.name}</div><div class="sub">${o.qty} 份 · ${p.time}</div><div class="caption">原型展示 · 非真實訂單</div></div></button>`}).join(''): `<div class="notice" style="margin:0"><div class="caption">還沒有模擬訂單。挑一份美味，體驗預訂流程吧。</div></div>`}<div style="margin-top:24px;background:var(--ivory);padding:17px;border-radius:14px"><div class="flex" style="gap:12px">${ic('leaf')} <strong style="font-size:15px;color:var(--forest)">讓每一天多一點剛好。</strong></div><p class="caption" style="margin:12px 0 0">好好珍惜食物，也好好生活。</p></div><div class="footnote">Prototype · 個人資訊不會上傳或儲存。</div></section>`}
function render(){const renders={home,explore,detail,checkout,success,favorites,account};$('screen-content').innerHTML=renders[state.screen]();$('screen-content').className='screen';nav()}
function action(el){const a=el.dataset.action;const id=Number(el.dataset.id);if(a==='nav'){go(({home:'home',search:'explore',heart:'favorites',user:'account'})[el.dataset.target]||'home');return}if(a==='open'){enterDetail(id);return}if(a==='back'){back();return}if(a==='checkout'){go('checkout');return}if(a==='confirm'){state.orders.unshift({id:state.selected,qty:state.qty,date:new Date().toISOString()});go('success');return}if(a==='fav'){if(state.favorites.has(id)){state.favorites.delete(id);toast('已取消收藏')}else{state.favorites.add(id);toast('已收藏，期待下次相遇')}render();return}if(a==='filter'){state.category=el.dataset.category;render();return}if(a==='plus'){const max=products[state.selected].remaining;if(state.qty<max){state.qty++;render()}else toast('示意剩餘數量已達上限');return}if(a==='minus'){if(state.qty>1){state.qty--;render()}else toast('至少預訂一份');return}if(a==='clear-search'){state.query='';state.category='全部';render();return}if(a==='loc'){toast('位置為草悟道示意，尚未連線定位');return}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)action(b)});
document.addEventListener('input',e=>{if(e.target.id==='find-product'){state.query=e.target.value;const r=$('results');if(r)r.innerHTML=exploreRows()}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&['detail','checkout','success'].includes(state.screen))back()});
render();
</script>
</body>
</html>
