<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YUHO 餘好｜行動 App 模擬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--page:#DEDDD5;--bg:#FCFBF7;--surf:#F3F1E9;--chip:#EAE6DA;--tx:#272C26;--mut:#8A8F84;--line:#E8E6DE;--btn:#3D463A;--btnt:#F7F5EF;--soft:#EDF0E6;--sage:#A9B49F;--clay:#BD9277;--map:#DDE4D6;--park:#B5C7AF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0E100D;--bg:#171B16;--surf:#222721;--chip:#2B312A;--tx:#F1EFE7;--mut:#9AA093;--line:#2E342D;--btn:#A9B49F;--btnt:#1C211B;--soft:#232A22;--map:#252C23;--park:#3A4A37}}
:root[data-theme="dark"]{--page:#0E100D;--bg:#171B16;--surf:#222721;--chip:#2B312A;--tx:#F1EFE7;--mut:#9AA093;--line:#2E342D;--btn:#A9B49F;--btnt:#1C211B;--soft:#232A22;--map:#252C23;--park:#3A4A37}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--tx);font-family:Inter,"Noto Sans TC",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:72px;padding:24px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{display:block;width:100%;height:100%;object-fit:cover;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;user-drag:none;pointer-events:none}
.ph{position:relative;overflow:hidden;background:var(--chip)}
.ph::after{content:"";position:absolute;inset:0;background:transparent}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:left}
button:focus-visible,input:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side{max-width:300px}
.side .wm{font-size:60px;font-weight:900;letter-spacing:.02em;line-height:1;color:var(--btn)}
.side .en{font-weight:700;letter-spacing:.42em;margin:10px 0 16px;color:var(--tx)}
.side p{color:var(--mut);line-height:1.9;margin:0 0 24px}
.side ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.side li button{width:100%;padding:13px 16px;border-radius:16px;background:var(--surf);font-size:15px}
.side li b{display:inline-block;width:28px;color:var(--clay);font-family:Inter}
.side small{display:block;margin-top:18px;color:var(--mut);line-height:1.7;font-size:12px}
.phone{width:390px;height:844px;max-height:calc(100dvh - 48px);background:var(--bg);border-radius:44px;overflow:hidden;position:relative;box-shadow:0 0 0 9px #20241E,0 40px 80px rgba(39,44,38,.25)}
.scr{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.pg{padding:32px 24px 24px}
.pg.t{padding-bottom:110px}
.v.in{animation:up .4s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eb{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.h1{font-size:36px;line-height:1.3;font-weight:900;color:var(--btn);margin:0}
.h2{font-size:24px;line-height:1.35;font-weight:700;margin:0;color:var(--btn)}
.sub{color:var(--mut);font-size:15px;line-height:1.7;margin:8px 0 0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.wm2{font-size:32px;font-weight:900;color:var(--btn);display:flex;align-items:flex-start;gap:2px}
.loc{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
.loc .i{width:18px;height:18px}
.round{width:56px;height:56px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--btn)}
.hero{display:block;width:100%;height:216px;border-radius:28px;margin:24px 0 20px}
.pill{position:absolute;top:16px;left:16px;z-index:1;background:var(--bg);color:var(--tx);border-radius:99px;padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:.02em}
.sec{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px;font-size:17px;font-weight:700;width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cd .ph{height:132px;border-radius:20px;margin-bottom:10px}
.cd h3{margin:0 0 8px;font-size:14px;font-weight:700}
.cd .pr{font-size:20px;font-weight:700;color:var(--btn);letter-spacing:-.01em}
.cd small{display:block;margin-top:4px;color:var(--mut);font-size:12px}
.tabs{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:12px 8px calc(22px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{flex:1;display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--mut);position:relative}
.tabs button.on{color:var(--tx);font-weight:700}
.tabs button.on::after{content:"";position:absolute;bottom:-14px;width:24px;height:3px;border-radius:2px;background:var(--btn)}
.phone.nt .tabs{display:none}
.search{display:flex;align-items:center;gap:12px;background:var(--surf);border-radius:20px;padding:0 20px;height:64px;color:var(--mut);margin:24px 0 16px}
.search input{flex:1;border:0;background:none;font:inherit;font-size:15px;color:var(--tx);min-width:0;outline-offset:6px}
.search input::placeholder{color:var(--mut)}
.chips{display:flex;gap:10px;margin-bottom:20px}
.chips button{padding:12px 22px;border-radius:99px;background:var(--chip);font-size:14px;font-weight:500}
.chips button.on{background:var(--btn);color:var(--btnt);font-weight:700}
.map{position:relative;height:190px;border-radius:24px;overflow:hidden;margin-bottom:24px;background:var(--bg)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;width:40px;height:40px;border-radius:50%;background:var(--btn);color:var(--btnt);display:grid;place-items:center;font-weight:700;font-size:15px;transform:translate(-50%,-50%)}
.row{display:flex;gap:18px;padding:16px 0;border-top:1px solid var(--line);width:100%}
.row:first-of-type{border-top:0;padding-top:0}
.row .ph{width:104px;height:104px;border-radius:20px;flex:none}
.row .in{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
.row h3{margin:0 0 4px;font-size:16px;font-weight:700}
.row small{color:var(--mut);font-size:13px}
.row .rr{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
.row .pr{font-size:20px;font-weight:700;color:var(--btn)}
.empty{padding:36px 0;text-align:center;color:var(--mut);line-height:1.8;font-size:14px}
.dph{height:384px;border-radius:0}
.cir{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));width:48px;height:48px;border-radius:50%;background:var(--bg);display:grid;place-items:center;z-index:2;color:var(--tx)}
.cir.f.on svg{fill:var(--clay);stroke:var(--clay)}
.sheet{background:var(--bg);border-radius:32px 32px 0 0;margin-top:-32px;position:relative;padding:28px 24px 8px}
.pricerow{display:flex;justify-content:space-between;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--line);margin-top:8px}
.pricerow b{font-size:34px;font-weight:700;color:var(--btn);letter-spacing:-.02em}
.pricerow span{color:var(--mut);font-size:14px}
.ln{display:flex;align-items:center;gap:14px;font-size:15px;font-weight:500;margin:14px 0}
.may h4{display:flex;align-items:center;gap:14px;font-size:19px;margin:22px 0 10px}
.may p{margin:0 0 4px;color:var(--mut);font-size:15px;line-height:1.9}
.note{border-top:1px solid var(--line);padding-top:14px;margin-top:20px;color:var(--mut);font-size:13px}
.cta{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:var(--btn);color:var(--btnt);border-radius:24px;height:64px;font-size:17px;font-weight:700;letter-spacing:.02em}
.cta.ghost{background:var(--chip);color:var(--tx);margin-top:12px}
.bar{position:sticky;bottom:0;padding:16px 24px calc(24px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,var(--bg) 24%)}
.nav{display:flex;align-items:center;gap:20px;margin-bottom:28px}
.nav button{color:var(--tx);display:grid;place-items:center;width:32px;height:32px}
.nav .h2{font-size:28px}
.item{display:flex;gap:20px;background:var(--surf);border-radius:28px;padding:20px;margin:24px 0 32px}
.item .ph{width:120px;height:120px;border-radius:22px;flex:none}
.item .in{display:flex;flex-direction:column;justify-content:space-between;flex:1;min-width:0}
.item h3{margin:4px 0 6px;font-size:17px;font-weight:700}
.item small{color:var(--mut);font-size:14px}
.item .pr{font-size:26px;font-weight:700;color:var(--btn)}
.step{display:flex;align-items:center;gap:6px;margin-top:2px}
.step button{width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:18px;text-align:center}
.step b{min-width:20px;text-align:center;font-size:14px}
.tl{position:relative;margin:16px 0 28px}
.tl .p{display:flex;gap:20px;padding-bottom:28px;position:relative}
.tl .p:last-child{padding-bottom:0}
.tl .dot{width:20px;height:20px;border-radius:50%;background:var(--btn);flex:none;margin-top:4px}
.tl .p:not(:last-child)::before{content:"";position:absolute;left:9px;top:28px;bottom:-4px;width:3px;background:var(--line)}
.tl small{display:block;color:var(--mut);font-size:14px;margin-bottom:4px}
.tl b{font-size:19px;font-weight:500}
.soft{background:var(--soft);border-radius:24px;padding:20px 22px;margin-bottom:28px}
.soft b{display:flex;align-items:center;gap:12px;font-size:16px;margin-bottom:8px}
.soft p{margin:0;font-size:14px;line-height:1.9}
.fee{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;color:var(--mut);font-size:16px}
.fee.tot{border-top:1px solid var(--line);color:var(--tx);font-weight:700;font-size:18px}
.fee.tot b{font-size:28px;color:var(--btn)}
.fee span:last-child{color:var(--tx)}
.dark{background:var(--btn);color:var(--btnt);border-radius:28px;padding:28px 28px 26px;margin:24px 0 32px}
.dark .eb{color:var(--sage);opacity:.9}
.dark .n{display:flex;align-items:baseline;gap:20px}
.dark .n b{font-size:64px;font-weight:700;line-height:1}
.dark .n span{font-size:17px}
.dark p{margin:16px 0 0;font-size:15px}
.tkt{background:var(--btn);color:var(--btnt);border-radius:28px;padding:28px;margin:28px 0 24px;text-align:center}
.tkt .eb{color:var(--sage)}
.tkt .code{font-size:68px;font-weight:700;letter-spacing:.16em;padding-left:.16em;line-height:1.2}
.tkt .cdn{margin-top:12px;font-size:14px;color:var(--sage)}
.tkt .cdn b{color:var(--btnt);font-variant-numeric:tabular-nums;font-size:18px}
.big{width:72px;height:72px}
.my{background:var(--surf);border-radius:28px;padding:22px 24px;margin:0 0 24px;display:flex;justify-content:space-between;align-items:center;width:100%}
.my b{font-size:22px;letter-spacing:.14em;color:var(--btn)}
.rem{display:flex;gap:20px;background:var(--surf);border-radius:28px;padding:24px;margin-top:28px;align-items:flex-start}
.rem .i{width:44px;height:44px;color:var(--btn)}
.rem h4{margin:0 0 8px;font-size:19px;color:var(--btn)}
.rem p{margin:0;color:var(--mut);font-size:15px;line-height:1.85}
.toast{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:9}
.toast.show{opacity:1}
@media (max-width:760px){body{padding:0;gap:0}.side{display:none}.phone{width:100%;height:100%;max-height:none;border-radius:0;box-shadow:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<aside class="side">
  <div class="wm">餘好。</div>
  <div class="en">YUHO</div>
  <p>Still good. Still worth sharing.<br>每一份好食物，都值得被好好遇見。<br>依你的 Figma 品牌規範重做的行動 App 模擬，可以點點看。</p>
  <ol>
    <li><button data-go="home"><b>01</b>首頁，今日精選</button></li>
    <li><button data-go="explore"><b>02</b>探索附近</button></li>
    <li><button data-shop="0"><b>03</b>商品詳情</button></li>
    <li><button data-conf="0"><b>04</b>確認預訂</button></li>
    <li><button data-go="me"><b>05</b>我的餘好</button></li>

  <small>MOCKUP ONLY ・ 所有店家、價格與商品為概念示意。</small>
</aside>
<main class="phone" id="app">
  <div class="scr" id="scr"></div>
  <nav class="tabs" id="tabs">
    <button data-tab="home"><svg class="i" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>首頁</button>
    <button data-tab="explore"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>探索</button>
    <button data-tab="fav"><svg class="i" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></svg>收藏</button>
    <button data-tab="me"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>我的</button>
  </nav>
  <div class="toast" id="toast"></div>
</main>

'<div class="map"><svg viewBox="0 0 342 190" preserveAspectRatio="none"><rect width="342" height="190" fill="var(--bg)"/><g fill="var(--map)"><rect x="0" y="0" width="90" height="62" rx="0"/><rect x="104" y="0" width="120" height="62"/><rect x="238" y="0" width="104" height="62"/><rect x="0" y="80" width="90" height="46"/><rect x="104" y="80" width="120" height="46"/><rect x="238" y="80" width="104" height="46"/><rect x="0" y="144" width="90" height="46"/><rect x="104" y="144" width="120" height="46"/><rect x="238" y="144" width="104" height="46"/></g><rect x="122" y="14" width="84" height="38" rx="14" fill="var(--park)"/><text x="130" y="38" font-size="11" font-weight="700" fill="var(--tx)" opacity=".7">草悟道</text></svg>'+
pins.map(function(p){return '<button class="pin" data-shop="'+p[2]+'" style="left:'+p[0]+'%;top:'+(p[1]*.9)+'%" aria-label="'+SHOPS[p[2]].n+'">'+(p[2]+1)+'</button>'}).join('')+'</div>'+
'<div class="sec" style="font-size:22px"><span>離你不遠的好味道</span><small style="font-size:13px;color:var(--mut);font-weight:400">依距離推薦・示意</small></div><div id="xl">'+list()+'</div></div>'}
function fav(){var ids=Object.keys(S.fav).filter(function(k){return S.fav[k]});
return '<div class="pg t"><h1 class="h1" style="font-size:40px">收藏</h1><p class="sub" style="margin-bottom:24px">喜歡的好店家，都收在這裡。</p>'+(ids.length?ids.map(row).join(''):'<div class="empty">還沒有收藏。<br>看到喜歡的，點一下愛心。</div>')+'</div>'}
function me(){var ids=Object.keys(S.fav).filter(function(k){return S.fav[k]}),n=ids.length,o=S.order;
return '<div class="pg t"><div class="top" style="margin-bottom:20px"><h1 class="h1" style="font-size:40px">我的餘好</h1><span class="round">'+I.leaf+'</span></div>'+
'<p class="eb">Good choices, every day</p><h2 class="h2" style="font-size:26px;color:var(--tx)">你收藏的，都是好日常。</h2>'+
(o?'<button class="my" data-go="done" style="margin-top:24px;margin-bottom:0"><span><small class="eb" style="display:block;margin:0 0 4px">今天的預訂</small>'+SHOPS[o.i].n+'</span><b>'+o.code+'</b></button>':'')+
'<div class="dark"><p class="eb" style="margin:0 0 16px">Your small, meaningful steps</p><div class="n"><b>'+(n<10?'0':'')+n+'</b><span>已收藏的好店家</span></div><p>'+(S.saved?'已帶回 '+S.saved+' 份好食物。每個選擇，都讓珍惜成為日常。':'每個選擇，都讓珍惜成為日常。')+'</p></div>'+
'<div class="sec"><span style="font-size:24px">收藏店家</span><button data-tab="fav" style="font-size:14px;font-weight:400;color:var(--mut)">查看全部 →</button></div>'+
(n?'<div class="g2">'+ids.slice(0,2).map(function(k){var s=SHOPS[k];return '<button class="cd" data-shop="'+k+'">'+ph(s).replace('class="ph "','class="ph" style="height:170px"')+'<h3 style="font-size:17px;margin-top:12px">'+s.st+'</h3><small>'+s.tag+'</small></button>'}).join('')+'</div>':'<div class="empty">還沒有收藏的店家。</div>')+
'<div class="rem">'+I.leaf+'<div><h4>讓每一天多一點剛好。</h4><p>追蹤喜歡的店家，當美味再上架時，你就能第一時間遇見它。</p></div></div></div>'}
function detail(){var s=SHOPS[S.sel],f=S.fav[S.sel];
return '<div style="position:relative">'+ph(s,'dph')+'<button class="cir" style="left:24px" data-go="'+S.tab+'" aria-label="返回">'+I.back+'</button><button class="cir f'+(f?' on':'')+'" style="right:24px" data-fav="'+S.sel+'" aria-label="收藏">'+I.heart+'</button></div>'+
'<div class="sheet"><p class="eb">'+s.eb+'</p><h2 class="h1" style="font-size:30px">'+s.n+'</h2><p class="sub" style="font-size:16px">'+s.sub+'</p>'+
'<div class="pricerow"><b>NT$ '+s.p+'</b><span>參考原價 NT$ '+s.o+'</span></div>'+
'<div class="may"><h4>'+I.bag+'今天可能遇見</h4><p>'+s.may+'</p><p>實際內容及數量依店家現場供應為準。</p></div>'+
'<div class="ln" style="margin-top:22px">'+I.clock+'今日自取 '+s.w+'</div><div class="ln">'+I.pin+s.st+'・台中西區（示意）</div>'+
'<div class="note">訂購前請確認食材及過敏原資訊</div></div>'+
'<div class="bar"><button class="cta" data-conf="'+S.sel+'">預訂這份好食物 '+I.arrow+'</button></div>'}
function confirm(){var s=SHOPS[S.sel],t=s.p*S.qty;
return '<div class="pg" style="padding-bottom:0"><div class="nav"><button data-shop="'+S.sel+'" aria-label="返回">'+I.back+'</button><h1 class="h2" style="font-size:30px;font-weight:900">確認預訂</h1></div>'+
'<p class="eb">One more good thing</p><h2 class="h2" style="font-size:24px;color:var(--tx)">把今天的美好帶回家。</h2>'+
'<div class="item">'+ph(s)+'<div class="in"><div><h3>'+s.n+'</h3><small>今日限量・'+S.qty+' 份</small></div><div class="row" style="padding:0;border:0;justify-content:space-between;align-items:center;gap:0"><span class="pr">NT$'+t+'</span><span class="step"><button data-q="-1" aria-label="減少">−</button><b>'+S.qty+'</b><button data-q="1" aria-label="增加">+</button></span></div></div></div>'+
'<h3 class="h2" style="font-size:22px;color:var(--tx)">取餐資訊</h3><div class="tl"><div class="p"><span class="dot"></span><div><small>自取時間</small><b>今天 '+s.w.replace(/ /g,' ')+'</b></div></div><div class="p"><span class="dot"></span><div><small>取餐地點</small><b>'+s.st+'・台中西區（示意）</b></div></div></div>'+
'<div class="soft"><b>'+I.info+'友善提醒</b><p>請於取餐時間內到店領取，並留意食品保存方式與過敏原資訊。</p></div>'+
'<h3 class="h2" style="font-size:22px;color:var(--tx)">費用明細</h3><div class="fee" style="margin-top:8px"><span>商品金額</span><span>NT$'+t+'</span></div><div class="fee tot"><span>合計</span><b>NT$'+t+'</b></div></div>'+
'<div class="bar"><button class="cta" data-act="book">確認預訂・NT$'+t+'</button></div>'}
function done(){var o=S.order;if(!o)return '<div class="pg"><div class="empty" style="padding-top:120px">目前沒有預訂。<button class="cta ghost" data-go="home">回到首頁</button></div></div>';var s=SHOPS[o.i];
return '<div class="pg" style="padding-top:64px;text-align:center"><span style="color:var(--btn)">'+I.check.replace('class="i"','class="i big"')+'</span><h1 class="h1" style="margin-top:20px;font-size:32px">預訂完成。</h1><p class="sub">請在取餐時段內到店，出示取餐碼。</p>'+
'<div class="tkt"><p class="eb">取餐碼</p><div class="code">'+o.code+'</div><div class="cdn">取餐時段結束前還有 <b id="cd">42:00</b></div></div>'+
'<p class="sub" style="margin:0 0 28px;line-height:1.9"><b style="color:var(--tx)">'+s.n+'，'+o.qty+' 份</b><br>今日自取 '+s.w+'<br>'+s.st+'・台中西區（示意）</p>'+
'<button class="cta" data-act="got">我已取餐</button><button class="cta ghost" data-go="home">回到首頁</button></div>'}
var V={home:home,explore:explore,fav:fav,me:me,detail:detail,confirm:confirm,done:done};
function render(){var v=S.view,ch=v!==S.last;S.last=v;if(V[v]===home||v==='explore'||v==='fav'||v==='me')S.tab=v;
var sc=$('scr'),top=sc.scrollTop;sc.innerHTML='<div class="v'+(ch?' in':'')+'">'+V[v]()+'</div>';
$('app').className='phone'+(v==='detail'||v==='confirm'||v==='done'?' nt':'');
[].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.className=b.dataset.tab===S.tab?'on':''});
sc.scrollTop=ch?0:top;tick()}
function tick(){var el=$('cd');if(!el||!S.order)return;var r=Math.max(0,Math.round((S.end-Date.now())/1000)),m=Math.floor(r/60),s=r%60;el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s}
setInterval(tick,1000);
function toast(m){var t=$('toast');t.textContent=m;t.className='toast show';setTimeout(function(){t.className='toast'},2000)}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var d=b.dataset;
if(d.shop!==undefined){S.sel=+d.shop;S.qty=1;S.view='detail'}
else if(d.conf!==undefined){S.sel=+d.conf;S.view='confirm'}
else if(d.fav!==undefined){S.fav[d.fav]=S.fav[d.fav]?0:1;toast(S.fav[d.fav]?'已加入收藏':'已取消收藏')}
else if(d.cat){S.cat=d.cat}
else if(d.q){S.qty=Math.min(3,Math.max(1,S.qty+(+d.q)))}
else if(d.tab||d.go){S.view=d.tab||d.go}
else if(d.act==='book'){S.order={i:S.sel,qty:S.qty,code:String(Math.floor(1000+Math.random()*9000))};S.end=Date.now()+42*60000;S.view='done'}
else if(d.act==='got'){S.saved+=S.order.qty;S.order=null;S.view='home';toast('謝謝你，讓好食物被好好遇見')}
else return;render()});
document.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;$('xl').innerHTML=list()}});
/* 圖片與內容保護 */
document.addEventListener('contextmenu',function(e){e.preventDefault()});
document.addEventListener('dragstart',function(e){e.preventDefault()});
document.addEventListener('keydown',function(e){var k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey;
if(e.key==='F12'||(c&&['s','u','p','i','j'].indexOf(k)>-1)||(c&&e.shiftKey&&['i','j','c'].indexOf(k)>-1)){e.preventDefault();return false}});
render();
</script>
</body>
</html>
